<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#glowGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Inner Flow Ring & Checkmark Graphic -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="16"/>
  <path d="M 256 116 A 140 140 0 1 1 140 330" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Centered Flow Lightning / Check Glyph -->
  <path d="M190 260 L235 305 L325 205" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Subtle accent dot for continuous rhythm -->
  <circle cx="256" cy="116" r="14" fill="#38bdf8"/>
</svg>
